<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <title>Zeiterfassung PWA</title>
</head>
<body>
    <header>
        <h1>Zeiterfassung</h1>
        <nav>
            <button id="prev-day">&lt;</button>
            <span id="current-date"></span>
            <button id="next-day">&gt;</button>
        </nav>
    </header>
    <main>
        <section id="timestamps">
            <h2>Zeitstempel</h2>
            <div id="timestamp-form">
                <div class="form-group">
                    <label for="timestamp-time">Zeit:</label>
                    <input type="time" id="timestamp-time">
                </div>
                <div class="form-group">
                    <label for="timestamp-label">Label:</label>
                    <input type="text" id="timestamp-label" list="label-suggestions">
                    <datalist id="label-suggestions"></datalist>
                </div>
                <div class="form-group">
                    <label for="timestamp-comment">Kommentar:</label>
                    <input type="text" id="timestamp-comment">
                </div>
                <div class="form-group checkbox">
                    <input type="checkbox" id="is-start-stamp">
                    <label for="is-start-stamp">Startstempel</label>
                </div>
                <button id="add-timestamp">Zeitstempel hinzufügen</button>
            </div>
            <div class="timestamps-container">
                <h3>Heutige Zeitstempel</h3>
                <ul id="timestamp-list"></ul>
            </div>
        </section>
        <section id="summary">
            <h2>Tageszusammenfassung</h2>
            <div id="summary-content"></div>
        </section>
    </main>
    <footer>
        <button id="export-data">Exportieren</button>
        <label for="import-data" class="import-label">Importieren</label>
        <input type="file" id="import-data" accept=".json">
    </footer>
    <script src="app.js"></script>
</body>
</html>
